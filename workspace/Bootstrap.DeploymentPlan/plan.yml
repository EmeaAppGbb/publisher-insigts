$schema: https://developer.microsoft.com/json-schemas/fabric/item/deploymentPlan/definition/plan/1.0.0/schema.json
version: 1.0.0
groups:
  - name: Books
    logicalId: 758429ae-f72b-4aae-921e-23d7c85f5cf3
  - name: SeedBooks
    logicalId: c8334dd2-4437-4c1f-9e3f-b402a9011d0c
    dependsOn:
      - groupName: Books
    postActions:
      - name: Seed fictional book data
        job:
          type: Execute
          logicalId: c8334dd2-4437-4c1f-9e3f-b402a9011d0c
          parameters:
            - name: lakehouse_name
              value: Books
            - name: allow_other_workspaces
              value: false
  - name: BookEvents
    logicalId: 2be4d554-4185-47ae-9d6d-2d79c49a2992
  - name: BookSignals
    logicalId: 042d6a15-62ec-4c64-9989-e12f7fadf253
    dependsOn:
      - groupName: BookEvents
  - name: ComputeBookSignals
    logicalId: 0fdeff35-5d26-490a-9280-be08db7f167c
    dependsOn:
      - groupName: SeedBooks
      - groupName: BookSignals
    postActions:
      - name: Compute the latest week's signals
        job:
          type: Execute
          logicalId: 0fdeff35-5d26-490a-9280-be08db7f167c
          parameters:
            - name: lakehouse_name
              value: Books
            - name: kql_database_name
              value: BookSignals
  - name: BooksOntology
    logicalId: 0291970c-8a8b-4481-b30b-ed6a309d2368
    dependsOn:
      - groupName: ComputeBookSignals
  - name: BindBooks
    logicalId: b46187c3-8831-49fe-b138-a1edb0f64897
    dependsOn:
      - groupName: BooksOntology
    postActions:
      - name: Bind the books ontology
        job:
          type: Execute
          logicalId: b46187c3-8831-49fe-b138-a1edb0f64897
          parameters:
            - name: lakehouse_name
              value: Books
            - name: ontology_name
              value: BooksOntology
  - name: PublishBooksKnowledge
    logicalId: 7e20d9b3-f69a-4e6d-af75-74a459e2ccc0
    dependsOn:
      - groupName: Books
    postActions:
      - name: Publish the approved documents
        job:
          type: Execute
          logicalId: 7e20d9b3-f69a-4e6d-af75-74a459e2ccc0
          parameters:
            - name: lakehouse_name
              value: Books
            - name: allow_other_workspaces
              value: false
